<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
</head>

<body>
    <div class="container">
        <h1>Calculator Demo</h1>
        <div class="mb-3 row">
            <label for="n1" class="col-sm-1 col-form-label">Number 1: </label>
            <div class="col-sm-5">
                <input type="text" class="form-control" id="n1" value="0">
            </div>
            <label for="n2" class="col-sm-1 col-form-label">Number 2:</label>
            <div class="col-sm-5">
                <input type="text" class="form-control" id="n2" value="0">
            </div>
        </div>
       
        <select class="form-select w-25" id="op" aria-label="Default select example">
            
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <button type="button" class="btn btn-primary mt-3" onclick="calculate()">Calculate</button>
        <p id="res" class="mt-2">Result : </p>
    </div>

    <script src="calculator.js"> </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
