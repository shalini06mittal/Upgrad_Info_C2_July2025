<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops Demo</title>
</head>
<body>
    <h1>Loops Demo</h1>
    <script>
        for(let i=1;i<=10;i++){
            console.log(i)
        }
        let i=1;
        while(i<=5){
            console.log(i**3)
            i++;
        }
        i=1;
        do{
            console.log(Math.sqrt(i));
            i++;
        }while(i<=5);


        for(let i=1;i<=5;i++){
            if(i%3==0)
            break;
        console.log(i)
        }
         for(let i=1;i<=5;i++){
            if(i%3==0)
            continue;
        console.log(i)
        }
        
    </script>
</body>
</html>
