        // const square = a=>{

       // const square = a =>  a**2;
        

        // callback functions
        function calc(arr, fn){
            console.log(fn);
            for(let v of arr){
                console.log(fn(v))
            }
        }
        calc([1,2,3,4,5], a =>  a**2);
        calc([1,2,3,4,5], a =>  a**3);
        calc([1,2,3,4,5], a =>  Math.sqrt(a));
    </script>
