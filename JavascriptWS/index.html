<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Javascript</title>
</head>
<body>
    <h1>Javascript Basics</h1>
        a = 10;
        console.log(typeof(a))
    <script>
        /*
        data types
        variables
        operators:
        unary = ++ -- - !
        binary:
        arithmetic  + - * / % **
        relational < > <= >= == != === !==
        logical & |
        conditional - if/else and switch/case
        loops = for/ while/ do-while
        arrays = 1D / 2D [] and indexing
        functions [ detailed ]
        classes
        objects : Math/ Date / History
        DOM - Document Object model
        JS - dynamic typing , var / let/ const
        Java - static typing , int / char ....
        Data Types:
        1. number (int and float)
        2. string '' or ""
        3. boolean - true and false
        */
        a = 10;
        console.log(typeof(a))
        a = "hello"
        console.log(typeof(a))
        a = 10.3
        console.log(typeof(a))
        a = true
        console.log(typeof(a))
        // undefined, null, NaN and ReferenceError
        console.log(x);
        var x = 10;
        console.log(x)
        //console.log(y)
        let y = "hey";
        console.log(y)
        const s = 200;
        //s = 20;
    </script>
</body>
</html>
