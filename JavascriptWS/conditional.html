<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COnditional Constructs</title>
</head>

<body>
    <h1>If else and switch case</h1>
    <script>
        /**
         * WAP to take name as input and if user provides
         * the value say "Welcome <username>"
         * else say "Welcome Guest"
         */

        let n = prompt("enter a number");
        console.log(n)
        
        if(n){
            n = parseInt(n);
            console.log(n);
            if (n > 0)
                console.log(n, "is pos")
            else if (n < 0)
                console.log(n, "is neg")
            else
                console.log(n, "is 0")
        }
        // truthy and falsy - 
        // 0, null, undefined, '' -> falsy
       // n=undefined
        if(n)
            console.log('yes');
        else
            console.log('no');

        switch(n){
            case 1: console.log('ONE');
            break;
            case 2: console.log('TWO');
            break;
            case 3: console.log('THREE');
            break;
            default: console.log('DEFAULT');
        }
    </script>
</body>
</html>
