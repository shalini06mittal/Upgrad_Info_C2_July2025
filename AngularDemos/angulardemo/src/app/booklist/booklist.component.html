<h4 class="mt-3">List of Books!!</h4>

<div *ngIf="blist.length!=0">
    {{blist | json}}

<div *ngIf="blist?.length==0; else books">
    <p>No Books Added</p>
</div>
<ng-template #books>
    <div *ngFor="let book of blist" class="mt-3">
        <div class="row">
        <div class="col-md-3">
            Id: 
        </div>
        <div class="col-md-5">
            {{book.bookid}}
        </div>
    </div>
    <div class="row">
        <div class="col-md-3">
            Title: 
        </div>
        <div class="col-md-5">
            {{book.title}}
        </div>
    </div>
    <div class="row">
        <div class="col-md-3">
            Author: 
        </div>
        <div class="col-md-5">
            {{book.author}}
        </div>
    </div>
    <div class="row">
        <div class="col-md-3">
            Price: 
        </div>
        <div class="col-md-5">
                {{book.price}}
        </div>
    </div>
    <div class="row">
        <div class="col-md-3">
            Description: 
        </div>
        <div class="col-md-5">
            {{book.desc}}
        </div>
    </div>

        <hr/>
    </div>
</ng-template>
