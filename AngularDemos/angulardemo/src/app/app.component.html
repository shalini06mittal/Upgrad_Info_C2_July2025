binding data with view

[]

<h4>Data Binding difference</h4>
Proper Binding: <input type="checkbox" 
name="" [checked]="enabled"
id="" >
Improper Binding: <input type="checkbox" 
name="" checked
id="" >
<!-- event binding ()-->
<button (click)="change()">Enabled</button>
